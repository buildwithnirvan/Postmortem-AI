[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Hindsight server (set HINDSIGHT_INTEGRATION=1)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/data/*" = ["E501"]
